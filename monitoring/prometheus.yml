global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "taskflow-server"
    metrics_path: /api/metrics
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ["host.docker.internal:4000"]
    # Metrics is auth-protected — inject via envsubst (see docker-compose.monitoring.yml command)
    authorization:
      type: Bearer
      credentials: "${METRICS_BEARER_TOKEN:-dummy-for-local-dev}"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
