global:
  # Configure SMTP or webhook to receive alerts
  # smtp_from: "alerts@taskflow.dev"
  # smtp_smarthost: "smtp.example.com:587"

route:
  group_by: ["alertname"]
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: "default"

receivers:
  - name: "default"
    # Add webhook/email/pagerduty here. Empty receiver logs only — add at least one notifier in prod.
    webhook_configs:
      - url: "http://host.docker.internal:4000/api/alerts/webhook"
        send_resolved: true
