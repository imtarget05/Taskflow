name: keepalive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        run: |
          curl -sf -o /dev/null --max-time 60 \
            https://taskflow-server-n9a7.onrender.com/api/health \
            || echo "health check returned non-2xx (cold start or down)"