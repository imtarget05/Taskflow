name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  lint-test-build:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow
          POSTGRES_DB: taskflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        working-directory: server
        run: npx prisma generate

      - name: Run migrations (test db)
        working-directory: server
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://taskflow:taskflow@localhost:5432/taskflow_test?schema=public

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Dependency audit (production dependencies)
        # Strict gate on production dependencies only: dev tooling
        # vulnerabilities never ship in the runtime image (--omit=dev).
        run: npm audit --omit=dev --audit-level=high

      - name: Run backend tests
        working-directory: server
        run: npm run test:coverage
        env:
          DATABASE_URL: postgresql://taskflow:taskflow@localhost:5432/taskflow_test?schema=public
          JWT_SECRET: test-secret
          JWT_REFRESH_SECRET: test-refresh-secret

      - name: Run frontend tests
        working-directory: client
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            server/coverage
            client/coverage
          retention-days: 7

  docker-build:
    name: Build & push Docker images (GHCR)
    runs-on: ubuntu-latest
    needs: [lint-test-build, secret-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/taskflow-server:latest
            ghcr.io/${{ github.repository_owner }}/taskflow-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/${{ github.repository_owner }}/taskflow-server:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./client/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/taskflow-client:latest
            ghcr.io/${{ github.repository_owner }}/taskflow-client:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy backend to Render
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      # Pin the Render service to the immutable commit-SHA image tag instead of
      # the mutable :latest tag. Render Blueprints cannot express a dynamic
      # image tag, so this uses the Render API. Skipped silently when
      # RENDER_API_KEY / RENDER_SERVICE_ID are not configured (the service then
      # keeps pulling :latest as before). Set these two secrets in GitHub to
      # enable deterministic deploys + one-command rollbacks.
      # NOTE: a step's `if: env.X` cannot see the step's own `env:` block, so
      # secret availability is resolved in a dedicated step whose output gates
      # the actual pinning step.
      - name: Resolve Render pinning config
        id: renderpin
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_OWNER_ID: ${{ secrets.RENDER_OWNER_ID }}
        run: |
          if [ -n "$RENDER_API_KEY" ] && [ -n "$RENDER_SERVICE_ID" ] && [ -n "$RENDER_OWNER_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Render image pinning skipped: RENDER_API_KEY / RENDER_SERVICE_ID / RENDER_OWNER_ID not configured; service keeps pulling :latest."
          fi

      - name: Pin Render image to commit SHA
        if: steps.renderpin.outputs.enabled == 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_OWNER_ID: ${{ secrets.RENDER_OWNER_ID }}
        run: |
          IMAGE_PATH="ghcr.io/${{ github.repository_owner }}/taskflow-server:${{ github.sha }}"
          echo "Pinning Render service to $IMAGE_PATH"
          curl -fsS -X PATCH \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"image\": {\"ownerId\": \"$RENDER_OWNER_ID\", \"imagePath\": \"$IMAGE_PATH\"}}" \
            > /dev/null && echo "Image pinned."

      - name: Trigger Render deploy hook
        env:
          RENDER_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        if: env.RENDER_HOOK_URL != ''
        run: curl -fsS -X POST "$RENDER_HOOK_URL"
