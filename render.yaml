# Render Blueprint — deploy the backend image pushed to GHCR by CI.
# Frontend is served by Cloudflare Pages (see README "Deployment").
#
# NOTE: the image below is the bootstrap/default reference. On every push to
# main, the CI workflow (job "deploy") pins this service to the immutable
# commit-SHA tag via the Render API (requires RENDER_API_KEY,
# RENDER_SERVICE_ID and RENDER_OWNER_ID GitHub secrets). Without those
# secrets the service keeps pulling :latest.
services:
  - type: web
    name: taskflow-server
    runtime: image
    region: singapore
    image:
      url: ghcr.io/imtarget05/taskflow-server:latest
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: CLIENT_URL
        value: https://taskflow-8kv.pages.dev
      - key: ALLOWED_ORIGINS
        value: https://taskflow-8kv.pages.dev
      # Set these in the Render dashboard (never commit real values):
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      # AI agent — required for the assistant/legal features (see server/.env.example):
      - key: LLM_PROVIDER
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      # Google Sheets export (optional — CSV export works without these):
      - key: GOOGLE_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: GOOGLE_PRIVATE_KEY
        sync: false
      - key: GOOGLE_SHEETS_DELEGATED_USER
        sync: false