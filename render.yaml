# Render Blueprint — deploy the backend image pushed to GHCR by CI.
# Frontend is served by Cloudflare Pages (see README "Deployment").
services:
  - type: web
    name: taskflow-server
    runtime: image
    image:
      url: ghcr.io/imtarget05/taskflow-server:latest
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: CLIENT_URL
        value: https://taskflow.pages.dev
      - key: ALLOWED_ORIGINS
        value: https://taskflow.pages.dev
      # Set these in the Render dashboard (never commit real values):
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false